name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile bot.py gigachat_client.py prompt.py
      - name: Lint with Ruff
        run: pip install ruff && ruff check bot.py gigachat_client.py prompt.py